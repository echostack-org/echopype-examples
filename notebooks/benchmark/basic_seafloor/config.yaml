storage_chunks:
  ping_time: 64
  range_sample: 4096

scaling:
  file_counts: [1, 20]

benchmark:
  rounds: 3
  iterations: 1
  warmup_rounds: 1

datasets:
  ek80_hake:
    sonar_model: EK80
    waveform_mode: CW
    encode_mode: power
    channel: WBT 400142-15 ES70-7C_ES
    depth_offset: 9.8
    manifest: manifest.csv

profiles:
  zarr_threaded_2:
    backend: dask
    scheduler: threads
    num_workers: 2

chunk_configs:
  medium:
    ping_time: 64
    range_sample: 4096

  large:
    ping_time: 256
    range_sample: 16384

